<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Finanças — Controle financeiro pessoal</title>
<meta name="description" content="Controle financeiro pessoal: transações, contas, cartões, investimentos, empréstimos, orçamento, metas e relatórios.">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#182620">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

  :root[data-theme="light"]{
    --bg:#F6F5F0; --surface:#FFFFFF; --surface-alt:#F0EEE7; --text:#182620;
    --text-muted:#6B7A70; --border:#E3E0D5; --positive:#1F7A54; --negative:#B8433A;
    --info:#2F5D8A; --accent:#C68B2E;
  }
  :root[data-theme="dark"]{
    --bg:#101713; --surface:#17211B; --surface-alt:#1D2822; --text:#EDEAE2;
    --text-muted:#93A198; --border:#263129; --positive:#3FBE8A; --negative:#E07A6E;
    --info:#6FA0D6; --accent:#E8C371;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); }
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--text);
    display:flex; justify-content:center;
  }
  .serif{ font-family:'Fraunces',Georgia,'Times New Roman',serif; }
  #shell{
    width:100%; max-width:460px; min-height:100vh; background:var(--bg);
    position:relative;
  }
  #content{ padding-bottom:84px; min-height:100vh; }
  .screen{ padding:20px 18px 4px; animation:fadeIn .18s ease; }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  @keyframes slideUp{ from{transform:translateY(24px); opacity:0} to{transform:translateY(0); opacity:1} }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:16px; }
  .row{ display:flex; align-items:center; }
  .between{ display:flex; align-items:center; justify-content:space-between; }
  .muted{ color:var(--text-muted); }

  .icon-btn{ background:var(--surface-alt); border:none; border-radius:12px; width:34px; height:34px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .icon-btn svg{ width:17px; height:17px; }

  .badge{ border-radius:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:19px; }

  input, select{
    width:100%; background:var(--surface-alt); border:1px solid var(--border); border-radius:12px;
    padding:11px 13px; font-size:15px; color:var(--text); font-family:inherit; outline:none;
  }
  label.field-label{ font-size:12.5px; color:var(--text-muted); margin-bottom:6px; display:block; font-weight:600; }
  .field{ margin-bottom:14px; }

  .btn-primary{ width:100%; background:var(--text); color:var(--bg); border:none; border-radius:14px;
    padding:13px 16px; font-size:15.5px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn-ghost{ width:100%; background:transparent; border:1.5px solid var(--border); border-radius:14px;
    padding:13px 16px; font-size:15px; font-weight:600; color:var(--text); cursor:pointer; font-family:inherit; }

  .pill{ flex-shrink:0; padding:7px 13px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--text-muted); }
  .pill.active{ border-color:var(--text); background:var(--text); color:var(--bg); }
  .pill-row{ display:flex; gap:8px; overflow-x:auto; margin-bottom:14px; }
  .pill-row::-webkit-scrollbar{ display:none; }

  progress-bar{ display:block; }
  .progress-track{ background:var(--surface-alt); border-radius:999px; height:8px; overflow:hidden; }
  .progress-fill{ height:100%; border-radius:999px; transition:width .4s ease; }

  nav#bottomnav{ position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:460px; background:var(--surface);
    border-top:1px solid var(--border); display:flex; justify-content:space-around; align-items:center; padding:8px 4px 10px; z-index:40; }
  .nav-btn{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; padding:4px; width:62px; color:var(--text-muted); }
  .nav-btn svg{ width:20px; height:20px; }
  .nav-btn.active{ color:var(--text); }
  .nav-btn span{ font-size:10.5px; font-weight:500; }
  .nav-btn.active span{ font-weight:700; }
  #fab{ width:50px; height:50px; border-radius:25px; background:var(--text); border:none;
    display:flex; align-items:center; justify-content:center; margin-top:-22px; box-shadow:0 4px 10px rgba(0,0,0,.18); cursor:pointer; flex-shrink:0; }
  #fab svg{ width:24px; height:24px; stroke:var(--bg); }

  .sheet-backdrop{ position:fixed; inset:0; background:rgba(10,14,11,.5); display:none; align-items:flex-end;
    justify-content:center; z-index:50; }
  .sheet-backdrop.open{ display:flex; }
  .sheet{ background:var(--bg); width:100%; max-width:460px; max-height:88vh; overflow-y:auto;
    border-radius:22px 22px 0 0; padding:18px 18px 28px; animation:slideUp .25s ease; }
  .sheet-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .sheet-header h2{ font-size:20px; margin:0; }

  .toast{ position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg);
    padding:9px 16px; border-radius:12px; font-size:13.5px; white-space:nowrap; z-index:60; opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .toast.show{ opacity:1; }

  .tx-row{ display:flex; align-items:center; gap:10px; padding:9px 8px; border-bottom:1px solid var(--border); }
  .tx-row:last-child{ border-bottom:none; }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>
<div id="shell">
  <div id="content"></div>
  <nav id="bottomnav"></nav>
  <div class="sheet-backdrop" id="sheetBackdrop">
    <div class="sheet" id="sheetBody" onclick="event.stopPropagation()"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* =================================================================
   Utilitários
================================================================= */
const STORAGE_KEY = "financas-appdata-v1";

function uid(prefix){ return prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
function monthsAgoISO(n){ const d=new Date(); d.setMonth(d.getMonth()-n); return d.toISOString().slice(0,10); }
function currency(v){ return (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function fullDate(iso){ const [y,m,d]=iso.split("-"); return d+"/"+m+"/"+y; }
function monthLabel(offset){ const d=new Date(); d.setMonth(d.getMonth()+(offset||0)); return d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"}); }
function isInMonth(iso, offset){ const d=new Date(); d.setMonth(d.getMonth()+(offset||0));
  const [y,m]=iso.split("-"); return Number(y)===d.getFullYear() && Number(m)===d.getMonth()+1; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* =================================================================
   Dados padrão
================================================================= */

function demoDebts(){

    {id:uid("debt"), personId:"person-1", description:"Uber dividido", value:35, date:daysAgo(2), status:"pendente"},
    {id:uid("debt"), personId:"person-2", description:"Ingresso de show", value:250, date:daysAgo(15), status:"pago"},

}
function monthsElapsed(startISO){
  const start = new Date(startISO+"T00:00:00");
  const now = new Date();
  let months = (now.getFullYear()-start.getFullYear())*12 + (now.getMonth()-start.getMonth());
  if(now.getDate() < start.getDate()) months -= 1;
  return Math.max(0, months);
}
function frozenDebtAccumulated(d){
  const months = monthsElapsed(d.startDate);
  if(d.interestRate && d.interestRate>0){
    return d.originalValue * Math.pow(1+d.interestRate/100, months);
  }
  return d.originalValue;
}
function demoFrozenDebts(){

    {id:uid("fdebt"), name:"Fatura cartão atrasada", originalValue:2400, startDate:monthsAgoISO(4), interestRate:3.5, targetDate:"", notes:"Negociar com o banco antes de pagar", status:"standby"},

}
// defaultData(): pacote de DADOS DE EXEMPLO, usado apenas se a pessoa pedir
// explicitamente em Configurações > "Carregar dados de exemplo". NUNCA é usado
// automaticamente numa instalação nova.
function defaultData(){
  return {
    accounts: DEFAULT_ACCOUNTS.map(a=>({...a})),
    cards: DEFAULT_CARDS.map(c=>({...c})),
    categories: DEFAULT_CATEGORIES.map(c=>({...c})),
    transactions: demoTransactions(),
    investments: demoInvestments(),
    people: demoPeople(),
    debts: demoDebts(),
    frozenDebts: demoFrozenDebts(),
    budgets: [
      {categoryId:"cat-alimentacao", limit:800},

      {categoryId:"cat-transporte", limit:400},
    ],
    goals: [
      {id:uid("goal"), name:"Comprar carro", target:50000, current:18500, deadline:"2027-06-01"},
      {id:uid("goal"), name:"Viagem", target:8000, current:3200, deadline:"2027-01-15"},
    ],
    darkMode:false,
  };
}

// emptyData(): a "forma" completa dos dados, com todos os campos existentes,
// porém vazios. É isso que uma instalação nova carrega — nada de dado fictício.
// Categorias padrão continuam pré-cadastradas por serem apenas configuração
// (rótulos), não dado financeiro da pessoa.
function emptyData(){
  return {
    accounts: [],
    cards: [],
    categories: DEFAULT_CATEGORIES.map(c=>({...c})),
    transactions: [],
    investments: [],
    people: [],
    debts: [],
    frozenDebts: [],
    budgets: [],
    goals: [],
    darkMode: false,
  };
}

// migrateData(): roda toda vez que os dados são carregados do armazenamento.
// Preenche com o valor padrão qualquer campo que não existir (ex.: se uma
// versão futura do app adicionar um campo novo, dados salvos antes disso
// continuam funcionando em vez de quebrar a tela).
function migrateData(loaded){
  const base = emptyData();
  const d = (loaded && typeof loaded === "object") ? loaded : {};
  Object.keys(base).forEach(key=>{
    if(d[key] === undefined || d[key] === null) d[key] = base[key];
  });
  ["accounts","cards","categories","transactions","investments","people","debts","frozenDebts","budgets","goals"].forEach(key=>{
    if(!Array.isArray(d[key])) d[key] = [];
  });
  if(typeof d.darkMode !== "boolean") d.darkMode = false;
  if(!d.categories.length) d.categories = DEFAULT_CATEGORIES.map(c=>({...c}));
  return d;
}

/* =================================================================
   Sincronização entre aparelhos via Supabase
   - Não é mesclagem inteligente: quem enviar por último prevalece.
   - URL/chave ficam salvas só neste navegador (localStorage), nunca
     pedidas de novo depois de configuradas.
================================================================= */
const SYNC_CFG_KEY = "financas-sync-cfg-v1";
const SYNC_TABLE_DEFAULT = "financas_sync";
const SYNC_AUTO_PUSH_DELAY = 4000;  // ms após uma alteração, antes de enviar sozinho
const SYNC_AUTO_PULL_EVERY = 20000; // ms entre verificações se há algo novo no servidor

let syncPushTimer = null;
let syncPullInterval = null;
let syncBusy = false;

function loadSyncCfg(){
  try{
    const raw = localStorage.getItem(SYNC_CFG_KEY);
    return raw ? { url:"", key:"", table:SYNC_TABLE_DEFAULT, rowId:"principal", auto:false, lastSyncedAt:null, ...JSON.parse(raw) }
                : { url:"", key:"", table:SYNC_TABLE_DEFAULT, rowId:"principal", auto:false, lastSyncedAt:null };
  }catch(e){
    return { url:"", key:"", table:SYNC_TABLE_DEFAULT, rowId:"principal", auto:false, lastSyncedAt:null };
  }
}
function saveSyncCfg(patch){
  const cfg = { ...loadSyncCfg(), ...patch };
  try{ localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(cfg)); }catch(e){}
  return cfg;
}
function syncHeaders(cfg){
  return { "apikey": cfg.key, "Authorization": `Bearer ${cfg.key}`, "Content-Type": "application/json" };
}
function cleanSupabaseUrl(url){
  return (url||"").trim().replace(/\/+$/,"");
}

function syncTableName(cfg){ return (cfg.table||"").trim() || SYNC_TABLE_DEFAULT; }
function friendlySyncError(rawText, cfg){
  try{
    const j = JSON.parse(rawText);
    if(j.code === "PGRST205"){
      return `A tabela "${syncTableName(cfg)}" não foi encontrada nesse projeto Supabase.\n\n`+
        `Confira:\n`+
        `1. Você rodou o SQL de criação da tabela no MESMO projeto cuja URL está preenchida aqui em cima?\n`+
        `2. O campo "Nome da tabela" está escrito exatamente igual ao nome que você criou (maiúsculas/minúsculas importam)?\n`+
        `3. No painel do Supabase, vá em Project Settings → API e clique em "Reload schema" — às vezes o cache demora a atualizar depois de criar uma tabela nova.`;
    }
    if(j.message) return j.message + (j.hint ? `\n(dica do Supabase: ${j.hint})` : "");
  }catch(e){}
  return rawText;
}

async function runPushToSupabase(silent){
  const cfg = loadSyncCfg();
  const url = cleanSupabaseUrl(cfg.url);
  if(!url || !cfg.key){ if(!silent) showToast("Preencha a URL e a chave do Supabase primeiro"); return; }
  if(syncBusy) return;
  syncBusy = true;
  try{
    const payload = [{ id: cfg.rowId || "principal", dados: data, atualizado_em: new Date().toISOString() }];
    const res = await fetch(`${url}/rest/v1/${syncTableName(cfg)}?on_conflict=id`, {
      method: "POST",
      headers: { ...syncHeaders(cfg), "Prefer": "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(payload),
    });
    if(!res.ok) throw new Error(friendlySyncError(await res.text(), cfg));
    saveSyncCfg({ lastSyncedAt: new Date().toISOString() });
    if(!silent) showToast("Dados enviados ao Supabase");
    if(ui.subpage === "config") openSubpage("config");
  }catch(e){
    if(!silent) alert("Não foi possível enviar ao Supabase:\n\n"+e.message);
  }finally{
    syncBusy = false;
  }
}
window.pushToSupabase = () => runPushToSupabase(false);

async function runPullFromSupabase(silent){
  const cfg = loadSyncCfg();
  const url = cleanSupabaseUrl(cfg.url);
  if(!url || !cfg.key){ if(!silent) showToast("Preencha a URL e a chave do Supabase primeiro"); return; }
  if(syncBusy) return;
  syncBusy = true;
  try{
    const res = await fetch(`${url}/rest/v1/${syncTableName(cfg)}?id=eq.${encodeURIComponent(cfg.rowId||"principal")}&select=dados,atualizado_em`, {
      headers: syncHeaders(cfg),
    });
    if(!res.ok) throw new Error(friendlySyncError(await res.text(), cfg));
    const rows = await res.json();
    if(!rows.length){ if(!silent) showToast("Ainda não há nada salvo no Supabase para este aparelho"); syncBusy=false; return; }
    if(!silent && !confirm("Isso vai SUBSTITUIR os dados deste aparelho pelos dados salvos no Supabase. Continuar?")){ syncBusy=false; return; }
    data = migrateData(rows[0].dados);
    persist();
    render();
    saveSyncCfg({ lastSyncedAt: new Date().toISOString() });
    if(!silent) showToast("Dados atualizados a partir do Supabase");
    else showToast("Sincronizado com outro aparelho");
  }catch(e){
    if(!silent) alert("Não foi possível puxar do Supabase:\n\n"+e.message);
  }finally{
    syncBusy = false;
  }
}
window.pullFromSupabase = () => runPullFromSupabase(false);

function scheduleAutoPush(){
  const cfg = loadSyncCfg();
  if(!cfg.auto || !cleanSupabaseUrl(cfg.url) || !cfg.key) return;
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(() => runPushToSupabase(true), SYNC_AUTO_PUSH_DELAY);
}

function startAutoPull(){
  clearInterval(syncPullInterval);
  syncPullInterval = setInterval(async () => {
    const cfg = loadSyncCfg();
    const url = cleanSupabaseUrl(cfg.url);
    if(!cfg.auto || !url || !cfg.key || syncBusy) return;
    try{
      const res = await fetch(`${url}/rest/v1/${syncTableName(cfg)}?id=eq.${encodeURIComponent(cfg.rowId||"principal")}&select=atualizado_em`, { headers: syncHeaders(cfg) });
      if(!res.ok) return;
      const rows = await res.json();
      if(!rows.length) return;
      const remoteTime = new Date(rows[0].atualizado_em).getTime();
      const localTime = cfg.lastSyncedAt ? new Date(cfg.lastSyncedAt).getTime() : 0;
      if(remoteTime > localTime + 2000) await runPullFromSupabase(true);
    }catch(e){ /* falha silenciosa: tenta de novo no próximo ciclo */ }
  }, SYNC_AUTO_PULL_EVERY);
}

function catById(){ return Object.fromEntries(data.categories.map(c=>[c.id,c])); }
function accById(){ return Object.fromEntries(data.accounts.map(a=>[a.id,a])); }
function cardByIdMap(){ return Object.fromEntries(data.cards.map(c=>[c.id,c])); }

function despesasPorCategoria(offset){
  const cats = catById();
  const txs = data.transactions.filter(t=>t.type==="despesa" && isInMonth(t.date, offset));
  const map = {};
  txs.forEach(t=>{ map[t.categoryId] = (map[t.categoryId]||0)+t.value; });
  return Object.entries(map).map(([catId,value])=>({catId,value,cat:cats[catId]})).sort((a,b)=>b.value-a.value);
}

function buildMonthlySeries(monthsBack){
  const arr = [];
  for(let m=monthsBack-1; m>=0; m--){
    const offset = -m;
    const txs = data.transactions.filter(t=>isInMonth(t.date, offset));
    const salario = txs.filter(t=>t.type==="receita" && t.categoryId==="cat-salario").reduce((s,t)=>s+t.value,0);
    const outras = txs.filter(t=>t.type==="receita" && t.categoryId!=="cat-salario").reduce((s,t)=>s+t.value,0);
    const despesa = txs.filter(t=>t.type==="despesa").reduce((s,t)=>s+t.value,0);
    arr.push({ name: monthLabel(offset).split(" ")[0].slice(0,3), salario, outras, despesa, receita: salario+outras, saldo: salario+outras-despesa });
  }
  return arr;
}

function despesasAnoBreakdown(){
  const year = String(new Date().getFullYear());
  const cats = catById();
  const map = {};
  data.transactions.filter(t=>t.type==="despesa" && t.date.slice(0,4)===year).forEach(t=>{
    map[t.categoryId] = (map[t.categoryId]||0)+t.value;
  });
  return Object.entries(map).map(([catId,value])=>({catId,value,cat:cats[catId]})).sort((a,b)=>b.value-a.value);
}

function sparklineSVG(values, color, w, h){
  const max = Math.max(...values), min = Math.min(...values);
  const range = (max-min) || 1;
  const step = w/Math.max(values.length-1,1);
  const pts = values.map((v,i)=>[i*step, h - ((v-min)/range)*h*0.8 - h*0.1]);
  const line = pts.map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const area = line + ` L${w},${h} L0,${h} Z`;
  const id = "grad-"+Math.random().toString(36).slice(2,8);
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

function donutCenterSVG(entries, centerValue, centerSubLines, size){
  size = size||96;
  const r = size*0.29, cx=size/2, cy=size/2, sw=size*0.17;
  const total = entries.reduce((s,e)=>s+e.value,0) || 1;
  const circumf = 2*Math.PI*r;
  let acc=0, segs="";
  if(!entries.length){
    segs = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${sw}"/>`;
  } else {
    entries.forEach(e=>{
      const frac = e.value/total;
      const dash = Math.max(frac*circumf-1.5,0);
      segs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${e.cat?e.cat.color:'#999'}" stroke-width="${sw}"
        stroke-dasharray="${dash} ${circumf-dash}" stroke-dashoffset="${-acc}" stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/>`;
      acc += frac*circumf;
    });
  }
  return `<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${segs}</svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
      <div style="font-size:${size*0.165}px;font-weight:700;">${centerValue}</div>
      <div style="font-size:${size*0.072}px;color:var(--text-muted);line-height:1.15;max-width:${size*0.64}px;margin-top:2px;">${centerSubLines}</div>
    </div>
  </div>`;
}

function ringMiniSVG(pctValue, color, size){
  size = size||58;
  const r = size*0.38, cx=size/2, cy=size/2, sw=size*0.15;
  const circumf = 2*Math.PI*r;
  const dash = (Math.min(pctValue,100)/100)*circumf;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-alt)" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-dasharray="${dash} ${circumf-dash}" stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy+size*0.07}" text-anchor="middle" font-size="${size*0.2}" font-weight="700" fill="var(--text)" font-family="Inter">${Math.round(pctValue)}%</text>
  </svg>`;
}

function getComputedColor(varName){
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim() || "#999";
}

function lineChartSVG(a, b, colorA, colorB, w, h){
  const max = Math.max(...a, ...b, 1);
  const n = a.length, step = w/Math.max(n-1,1);
  function pathFor(vals){
    return vals.map((v,i)=>{
      const x=i*step, y = h - (v/max)*h*0.82 - h*0.08;
      return (i===0?"M":"L")+x.toFixed(1)+","+y.toFixed(1);
    }).join(" ");
  }
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${pathFor(a)}" fill="none" stroke="${colorA}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${pathFor(b)}" fill="none" stroke="${colorB}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function donutSVG(entries, total){
  let acc = 0;
  const r = 26, cx=30, cy=30, circumf = 2*Math.PI*r;
  let segs = "";
  entries.forEach(e=>{
    const frac = e.value/total;
    const dash = frac*circumf;
    segs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${e.cat?e.cat.color:'#999'}" stroke-width="10"
      stroke-dasharray="${dash} ${circumf-dash}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${cx} ${cy})"/>`;
    acc += dash;
  });
  return `<svg width="80" height="80" viewBox="0 0 60 60">${segs}</svg>`;
}

          <div style="font-size:13.5px;font-weight:700;color:${t.type==="receita"?"var(--positive)":"var(--negative)"};">${t.type==="receita"?"+":"−"}${currency(t.value)}</div>

function renderInvestments(){

  const totalCurrent = withCalc.reduce((s,i)=>s+i.current,0);

  const byTypeMap = {};

        <div><div style="font-size:11.5px;opacity:.65;">Rentabilidade</div><div style="font-size:15px;font-weight:600;margin-top:2px;">${totalGainPct>=0?"+":""}${totalGainPct.toFixed(1)}%</div></div>
      </div>
    </div>

    <div id="investFormArea">${ui.invFormOpen ? renderInvestForm(ui.editingInvestmentId ? withCalc.find(i=>i.id===ui.editingInvestmentId) : null) : ""}</div>`;

        <div style="width:8px;height:8px;border-radius:4px;background:${e.meta.color};"></div>
        <span style="flex:1;color:var(--text-muted);">${e.meta.label}</span>
        <span style="font-weight:700;">${currency(e.value)}</span>
      </div>`;
    });
    html += `</div></div></div>`;
  }

  if(!ui.invFormOpen){
    html += `<div class="pill-row">
      <button class="pill ${filterType==="todos"?"active":""}" onclick="setInvestFilter('todos')">Todos</button>
      ${Object.entries(INVESTMENT_TYPES).map(([key,meta])=>`<button class="pill ${filterType===key?"active":""}" onclick="setInvestFilter('${key}')">${meta.emoji} ${meta.label}</button>`).join("")}

    if(!filtered.length){

          </div>

  return html;

function investDonutSVG(entries){
  const total = entries.reduce((s,e)=>s+e.value,0) || 1;
  let acc = 0;
  const r=26, cx=30, cy=30, circumf=2*Math.PI*r;
  let segs = "";
  entries.forEach(e=>{
    const frac = e.value/total;
    const dash = frac*circumf;
    segs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${e.meta.color}" stroke-width="10" stroke-dasharray="${dash} ${circumf-dash}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${cx} ${cy})"/>`;
    acc += dash;
  });
  return `<svg width="80" height="80" viewBox="0 0 60 60">${segs}</svg>`;
}

function projectionChartSVG(realVals, projVals, w, h){
  const allVals = [...realVals, ...projVals].filter(v=>v!=null);
  const max = Math.max(...allVals, 1);
  const min = Math.min(0, ...allVals);
  const range = (max-min) || 1;
  const n = realVals.length, step = w/Math.max(n-1,1);
  function pathFor(vals){
    let d = "", started = false;
    vals.forEach((v,i)=>{
      if(v==null){ started=false; return; }
      const x=i*step, y = h - ((v-min)/range)*h*0.84 - h*0.08;
      d += (started?"L":"M")+x.toFixed(1)+","+y.toFixed(1)+" ";
      started = true;
    });
    return d.trim();
  }
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${pathFor(realVals)}" fill="none" stroke="var(--info)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${pathFor(projVals)}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

  });
  html += `</div></div>`;

  html += `<div style="font-size:13.5px;font-weight:700;margin-bottom:8px;">Despesas por categoria (ano)</div>
    <div class="card" style="margin-bottom:16px;">`;
  if(despesasAno.length===0){
    html += `<div style="font-size:12.5px;color:var(--text-muted);text-align:center;padding:6px 0;">Nenhuma despesa registrada em ${currentYear}.</div>`;
  }
  despesasAno.forEach((e,i)=>{
    const pctShare = ((e.value/(despesaAno||1))*100).toFixed(0);
    html += `<div style="margin-bottom:${i<despesasAno.length-1?10:0}px;">
      <div class="between" style="font-size:12.5px;margin-bottom:4px;">
        <span style="color:var(--text-muted);">${e.cat?e.cat.emoji:""} ${esc(e.cat?e.cat.name:"—")}</span>
        <span style="font-weight:700;">${currency(e.value)} <span style="color:var(--text-muted);font-weight:500;">(${pctShare}%)</span></span>
      </div>
      ${progressBar((e.value/maxCatAno)*100, e.cat?e.cat.color:"var(--info)")}
    </div>`;
  });
  html += `</div>`;

  if(data.budgets.length > 0){
    html += `<div style="font-size:13.5px;font-weight:700;margin-bottom:8px;">Orçamento vs. realizado (mês atual)</div>
      <div class="card" style="margin-bottom:16px;">`;
    data.budgets.forEach((b,i)=>{
      const cat = catById()[b.categoryId];
      const gasto = currentMonthDespesas[b.categoryId] || 0;
      const pct = (gasto/b.limit)*100;
      const color = pct>=100 ? "var(--negative)" : pct>=80 ? "var(--accent)" : "var(--positive)";
      html += `<div style="margin-bottom:${i<data.budgets.length-1?12:0}px;">
        <div class="between" style="font-size:12.5px;margin-bottom:4px;">
          <span style="color:var(--text-muted);">${cat?cat.emoji:""} ${esc(cat?cat.name:"—")}</span>
          <span style="font-weight:700;">${currency(gasto)} / ${currency(b.limit)}</span>
        </div>
        ${progressBar(pct, color)}
      </div>`;
    });
    html += `</div>`;
  }

  const porConta = data.accounts.map(a=>({
    name:a.name,
    valor: data.transactions.filter(t=>t.accountId===a.id && t.type==="despesa").reduce((s,t)=>s+t.value,0)
  }));
  html += `<div style="font-size:13.5px;font-weight:700;margin-bottom:8px;">Despesas por conta</div><div class="card">`;
  porConta.forEach((c,i)=>{
    html += `<div class="between" style="padding:8px 2px;${i<porConta.length-1?"border-bottom:1px solid var(--border);":""}font-size:13px;">
      <span style="color:var(--text-muted);">${esc(c.name)}</span><span style="font-weight:700;">${currency(c.valor)}</span>
    </div>`;
  });
  html += `</div>`;
  return html;
}

/* --- Painel: Categorias --- */
function renderCategoriesPanel(){
  let html = "";
  ["receita","despesa"].forEach(t=>{
    html += `<div style="margin-bottom:16px;">
      <div style="font-size:12.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;">${t==="receita"?"Receitas":"Despesas"}</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">`;
    data.categories.filter(c=>c.type===t).forEach(c=>{
      html += `<div style="display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 10px 6px 6px;">
        ${badge(c.emoji,c.color,24)}<span style="font-size:12.5px;">${esc(c.name)}</span>
        <button onclick="removeCategory('${c.id}')" style="background:none;border:none;cursor:pointer;padding:0;display:flex;width:12px;height:12px;color:var(--text-muted);">${icon("x")}</button>
      </div>`;
    });
    html += `</div></div>`;
  });
  html += `<div style="font-size:14px;font-weight:700;margin:10px 0;">Nova categoria</div>
    <div style="display:flex;gap:10px;">
      <div style="width:60px;" class="field"><label class="field-label">Ícone</label><input id="cf-emoji" value="🏷️"></div>
      <div style="flex:1;" class="field"><label class="field-label">Nome</label><input id="cf-name" placeholder="Ex: Pets"></div>
    </div>
    <div class="field"><label class="field-label">Tipo</label>
      <select id="cf-type"><option value="despesa">Despesa</option><option value="receita">Receita</option></select>
    </div>
    <button class="btn-primary" onclick="saveCategory()">Adicionar categoria</button>`;
  return html;
}
function saveCategory(){
  const name = document.getElementById("cf-name").value.trim();
  if(!name) return;
  const type = document.getElementById("cf-type").value;
  if(data.categories.some(c=>c.type===type && c.name.toLowerCase()===name.toLowerCase())){
    if(!confirm(`Já existe uma categoria de ${type} chamada "${name}". Deseja criar mesmo assim?`)) return;
  }
  const cat = { id:uid("cat"), name, type, emoji:document.getElementById("cf-emoji").value||"🏷️", color:"#2F5D8A" };
  setData(d=>{ d.categories.push(cat); });
  showToast("Categoria criada");
  openSubpage("categorias");
}
window.saveCategory = saveCategory;
function removeCategory(id){
  if(!confirm("Excluir esta categoria? Transações já lançadas com ela permanecem, mas ficam sem categoria correspondente.")) return;
  setData(d=>{ d.categories = d.categories.filter(c=>c.id!==id); });
  openSubpage("categorias");
}
window.removeCategory = removeCategory;

function renderSyncSection(){
  const cfg = loadSyncCfg();
  const configured = !!(cleanSupabaseUrl(cfg.url) && cfg.key);
  const lastSync = cfg.lastSyncedAt ? new Date(cfg.lastSyncedAt).toLocaleString("pt-BR") : "nunca";
  return `
    <div class="card" style="margin-bottom:12px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:4px;">Sincronização entre aparelhos</div>
      <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:10px;line-height:1.4;">
        Use o mesmo Supabase em outro celular/computador para ver os mesmos dados nos dois. <strong>Não é uma mesclagem inteligente</strong>: quem enviar por último apaga o que o outro aparelho tinha mandado antes. A URL e a chave ficam salvas só neste navegador.
      </div>

      <div class="field"><label class="field-label">URL do projeto Supabase</label>
        <input value="${esc(cfg.url||"")}" placeholder="https://xxxxx.supabase.co" onchange="saveSyncField('url', this.value)"></div>
      <div class="field"><label class="field-label">Chave anon (public)</label>
        <input value="${esc(cfg.key||"")}" placeholder="eyJhbGciOi..." onchange="saveSyncField('key', this.value)"></div>
      <div class="field"><label class="field-label">Nome da tabela no Supabase</label>
        <input value="${esc(cfg.table||SYNC_TABLE_DEFAULT)}" placeholder="${SYNC_TABLE_DEFAULT}" onchange="saveSyncField('table', this.value)"></div>
      <div class="field"><label class="field-label">Identificador deste conjunto de dados</label>
        <input value="${esc(cfg.rowId||"principal")}" placeholder="principal" onchange="saveSyncField('rowId', this.value)"></div>

      <div class="between" style="margin:4px 0 12px;">
        <div>
          <div style="font-size:13px;font-weight:700;">Sincronizar automaticamente</div>
          <div style="font-size:11px;color:var(--text-muted);">Envia sozinho após alterações e verifica a cada ~20s</div>
        </div>
        <button onclick="toggleSyncAuto()" style="width:46px;height:26px;border-radius:13px;background:${cfg.auto?"var(--positive)":"var(--border)"};border:none;cursor:pointer;position:relative;flex-shrink:0;">
          <div style="width:20px;height:20px;border-radius:10px;background:#fff;position:absolute;top:3px;left:${cfg.auto?23:3}px;transition:left .2s;"></div>
        </button>
      </div>

      <div style="display:flex;gap:8px;margin-bottom:8px;">
        <button class="btn-ghost" style="flex:1;" onclick="pushToSupabase()">Enviar agora</button>
        <button class="btn-ghost" style="flex:1;" onclick="pullFromSupabase()">Puxar agora</button>
      </div>
      <div style="font-size:11px;color:var(--text-muted);">
        ${configured ? `Última sincronização: ${lastSync}` : "Preencha a URL e a chave para ativar"}
      </div>
    </div>`;
}

/* --- Painel: Configurações --- */
function renderSettingsPanel(){
  return `
    <div class="card" style="margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;">
      <div>
        <div style="font-size:14px;font-weight:700;">Modo escuro</div>
        <div style="font-size:12px;color:var(--text-muted);">Aplicado a todas as telas</div>
      </div>
      <button onclick="toggleDark()" style="width:46px;height:26px;border-radius:13px;background:${data.darkMode?"var(--positive)":"var(--border)"};border:none;cursor:pointer;position:relative;">
        <div style="width:20px;height:20px;border-radius:10px;background:#fff;position:absolute;top:3px;left:${data.darkMode?23:3}px;transition:left .2s;"></div>
      </button>
    </div>
    <div class="card" style="margin-bottom:12px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:4px;">Moeda</div>
      <div style="font-size:12.5px;color:var(--text-muted);">Real brasileiro (R$) · formato DD/MM/AAAA</div>
    </div>

    <div class="card" style="margin-bottom:12px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:4px;">Backup</div>
      <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:10px;">Seus dados ficam só neste aparelho/navegador. Baixe um backup regularmente para não correr o risco de perdê-los.</div>
      <button class="btn-primary" style="margin-bottom:8px;" onclick="downloadBackup()">Baixar backup completo (.json)</button>
      <label class="btn-ghost" style="display:flex;align-items:center;justify-content:center;cursor:pointer;">
        Restaurar backup
        <input type="file" accept="application/json" onchange="restoreBackupFile(this)" style="display:none;">
      </label>
    </div>

    ${renderSyncSection()}

    <div class="card" style="margin-bottom:12px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:8px;">Exportar dados</div>
      <button class="btn-primary" style="background:var(--info);" onclick="exportCSV()">Exportar como CSV</button>
    </div>

    <div class="card" style="margin-bottom:12px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:4px;">Dados de exemplo</div>
      <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:10px;">Quer só experimentar o app? Carregue dados fictícios para ver as telas preenchidas. Isso substitui os dados atuais.</div>
      <button class="btn-ghost" onclick="loadDemoData()">Carregar dados de exemplo</button>
    </div>

    <div class="card" style="margin-bottom:12px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:4px;color:var(--negative);">Apagar todos os dados</div>
      <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:10px;">Remove permanentemente tudo o que foi cadastrado neste aparelho. Baixe um backup antes, se quiser manter uma cópia.</div>
      <button class="btn-ghost" style="border-color:var(--negative);color:var(--negative);" onclick="resetAllData()">Apagar tudo</button>
    </div>

    <div class="card">
      <div style="font-size:14px;font-weight:700;margin-bottom:4px;">Privacidade</div>
      <div style="font-size:12.5px;color:var(--text-muted);">Não existe servidor por trás deste app: tudo fica salvo localmente, no armazenamento do seu próprio navegador.</div>
    </div>`;
}
function exportCSV(){
  const rows = [["Data","Tipo","Descrição","Categoria","Valor","Status"]];
  data.transactions.forEach(t=>{ rows.push([t.date,t.type,t.description,t.categoryId,String(t.value).replace(".",","),t.status]); });
  const csv = rows.map(r=>r.join(";")).join("\n");
  const blob = new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "movimentacoes.csv"; a.click();
  URL.revokeObjectURL(url);
  showToast("CSV exportado");
}
window.exportCSV = exportCSV;

function downloadBackup(){
  const payload = JSON.stringify(data, null, 2);
  const blob = new Blob([payload], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `backup-financas-${todayISO()}.json`; a.click();
  URL.revokeObjectURL(url);
  showToast("Backup baixado");
}
window.downloadBackup = downloadBackup;

function restoreBackupFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    input.value = "";
    let parsed;
    try{ parsed = JSON.parse(ev.target.result); }
    catch(err){ alert("Arquivo inválido: selecione um backup .json gerado por este app."); return; }
    if(!confirm("Isso vai SUBSTITUIR todos os dados atuais pelos dados deste backup. Essa ação não pode ser desfeita. Continuar?")) return;
    data = migrateData(parsed);
    persist();
    render();
    showToast("Backup restaurado");
  };
  reader.onerror = ()=>{ input.value=""; alert("Não foi possível ler o arquivo."); };
  reader.readAsText(file);
}
window.restoreBackupFile = restoreBackupFile;

function loadDemoData(){
  if(!confirm("Isso vai SUBSTITUIR os dados atuais por dados de exemplo (fictícios). Continuar?")) return;
  data = defaultData();
  persist();
  render();
  showToast("Dados de exemplo carregados");
}
window.loadDemoData = loadDemoData;

function resetAllData(){
  if(!confirm("Isso vai APAGAR PERMANENTEMENTE todos os seus dados deste aparelho. Essa ação não pode ser desfeita. Tem certeza?")) return;
  if(!confirm("Confirmando mais uma vez: apagar tudo?")) return;
  data = emptyData();
  persist();
  render();
  showToast("Todos os dados foram apagados");
}
window.resetAllData = resetAllData;


/* =================================================================
   Sheet: Nova/editar transação
================================================================= */
function openTxSheet(txId){
  ui.newTxOpen = true; ui.editingTxId = txId;
  const initial = txId ? data.transactions.find(t=>t.id===txId) : null;
  const type = initial ? initial.type : "despesa";
  openSheet(initial ? "Editar movimentação" : "Nova movimentação", renderTxForm(initial, type));
}
window.openTxSheet = openTxSheet;

function renderTxForm(initial, type){
  type = type || (initial ? initial.type : "despesa");
  const categories = data.categories.filter(c=>c.type===type);
  const useCard = initial ? !!initial.cardId : false;
  return `
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      ${[["despesa","Despesa","var(--negative)"],["receita","Receita","var(--positive)"],["transferencia","Transferência","var(--info)"]].map(([v,l,c])=>`
        <button onclick="switchTxType('${v}', '${initial?initial.id:""}')" style="flex:1;padding:9px 4px;border-radius:12px;font-size:12.5px;font-weight:700;cursor:pointer;
          border:1.5px solid ${type===v?c:"var(--border)"};background:${type===v?c+"18":"transparent"};color:${type===v?c:"var(--text-muted)"};">${l}</button>`).join("")}
    </div>
    <div class="field"><label class="field-label">Valor</label>
      <input id="tf-value" type="number" step="0.01" style="font-size:22px;padding:12px 13px;" value="${initial?initial.value:""}" placeholder="R$ 0,00" autofocus></div>
    <div class="field"><label class="field-label">Descrição</label><input id="tf-desc" value="${initial?esc(initial.description):""}" placeholder="Ex: Supermercado"></div>
    ${type!=="transferencia" ? `<div class="field"><label class="field-label">Categoria</label>
      <select id="tf-cat">${categories.map(c=>`<option value="${c.id}" ${initial&&initial.categoryId===c.id?"selected":""}>${c.emoji} ${esc(c.name)}</option>`).join("")}</select></div>` : ""}
    ${type==="despesa" && data.cards.length ? `<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
      <input type="checkbox" id="tf-usecard" ${useCard?"checked":""} onchange="toggleTxCardFields(this.checked)"> <label for="tf-usecard" style="font-size:13px;color:var(--text-muted);">Pagamento no cartão de crédito</label>
    </div>` : ""}
    <div id="tf-account-area">${renderTxAccountFields(initial, useCard)}</div>
    <div class="field"><label class="field-label">Data</label><input id="tf-date" type="date" value="${initial?initial.date:todayISO()}"></div>
    <div class="field"><label class="field-label">Observação (opcional)</label><input id="tf-notes" value="${initial&&initial.notes?esc(initial.notes):""}" placeholder="Detalhes adicionais"></div>
    <div style="display:flex;gap:8px;margin-bottom:18px;">
      ${[["pago","Pago"],["pendente","Pendente"]].map(([v,l])=>{
        const active = (initial?initial.status:"pago")===v;
        return `<button data-status="${v}" onclick="setTxStatus('${v}')" style="flex:1;padding:9px 4px;border-radius:12px;font-size:12.5px;font-weight:700;cursor:pointer;
          border:1.5px solid ${active?"var(--text)":"var(--border)"};background:${active?"var(--text)":"transparent"};color:${active?"var(--bg)":"var(--text-muted)"};" class="tf-status-btn">${l}</button>`;
      }).join("")}
    </div>
    <div style="display:flex;gap:10px;">
      <div style="flex:1;"><button class="btn-ghost" onclick="closeSheet()">Cancelar</button></div>
      <div style="flex:2;"><button class="btn-primary" onclick="saveTx('${initial?initial.id:""}')">${initial?"Salvar alterações":"Registrar movimentação"}</button></div>
    </div>
    <input type="hidden" id="tf-status" value="${initial?initial.status:"pago"}">
    <input type="hidden" id="tf-type" value="${type}">
  `;
}
function renderTxAccountFields(initial, useCard){
  if(useCard){
    return `<div class="field"><label class="field-label">Cartão</label>
      <select id="tf-card"><option value="">Selecione</option>${data.cards.map(c=>`<option value="${c.id}" ${initial&&initial.cardId===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
    <div class="field"><label class="field-label">Parcelas</label>
      <select id="tf-installments">${[1,2,3,4,5,6,10,12,18,24].map(n=>`<option value="${n}" ${initial&&initial.installment&&initial.installment.total===n?"selected":""}>${n}x</option>`).join("")}</select></div>`;
  }
  return `<div class="field"><label class="field-label">Conta</label>
    <select id="tf-account">${data.accounts.map(a=>`<option value="${a.id}" ${initial&&initial.accountId===a.id?"selected":""}>${esc(a.name)}</option>`).join("")}</select></div>`;
}
function toggleTxCardFields(checked){
  document.getElementById("tf-account-area").innerHTML = renderTxAccountFields(null, checked);
}
window.toggleTxCardFields = toggleTxCardFields;
function switchTxType(type, txId){
  const initial = txId ? data.transactions.find(t=>t.id===txId) : null;
  const sheetBody = document.getElementById("sheetBody");
  sheetBody.innerHTML = `<div class="sheet-header"><h2 class="serif">${initial?"Editar movimentação":"Nova movimentação"}</h2><button class="icon-btn" onclick="closeSheet()">${icon("x")}</button></div>${renderTxForm(initial, type)}`;
}
window.switchTxType = switchTxType;
function setTxStatus(v){
  document.getElementById("tf-status").value = v;
  document.querySelectorAll(".tf-status-btn").forEach(btn=>{
    const active = btn.getAttribute("data-status")===v;
    btn.style.border = "1.5px solid " + (active?"var(--text)":"var(--border)");
    btn.style.background = active?"var(--text)":"transparent";
    btn.style.color = active?"var(--bg)":"var(--text-muted)";
  });
}
window.setTxStatus = setTxStatus;

function saveTx(existingId){
  const type = document.getElementById("tf-type").value;
  const value = document.getElementById("tf-value").value;
  const description = document.getElementById("tf-desc").value.trim();
  if(!value || !description) return;
  const useCard = !!document.getElementById("tf-usecard") && document.getElementById("tf-usecard").checked;
  const catSel = document.getElementById("tf-cat");
  const categoryId = catSel ? catSel.value : (data.categories.find(c=>c.type===type)||{}).id;
  const date = document.getElementById("tf-date").value || todayISO();
  const status = document.getElementById("tf-status").value;
  const notes = document.getElementById("tf-notes").value;

  let accountId, cardId, installment;
  if(useCard){
    cardId = document.getElementById("tf-card").value || undefined;
    const total = Number(document.getElementById("tf-installments").value||1);
    if(total>1) installment = { current:1, total };
  } else {
    const accSel = document.getElementById("tf-account");
    accountId = accSel ? accSel.value : undefined;
  }

  const tx = { id: existingId||uid("tx"), type, value:Number(value), description, categoryId, date, status, accountId, cardId, notes: notes||undefined, installment };

  setData(d=>{
    d.transactions = d.transactions.filter(t=>t.id!==tx.id);
    d.transactions.unshift(tx);
  });
  closeSheet();
  render();
  showToast(existingId ? "Movimentação atualizada" : "Movimentação registrada");
}
window.saveTx = saveTx;

/* =================================================================
   Eventos globais
================================================================= */
function bindGlobalEvents(){
  document.getElementById("sheetBackdrop").onclick = closeSheet;
}

/* =================================================================
   Início
================================================================= */
loadData();
if(loadSyncCfg().auto) startAutoPull();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}
</script>
